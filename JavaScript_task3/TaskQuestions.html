<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Тест</title>
</head>

<body>
    <h1>Тест</h1>
    <script>
        let questions = [
            "JavaScript є мовою програмування?",
            "CSS може змінювати колір тексту?",
            "JavaScript використовується для створення веб-сторінок?",
            "HTML і CSS — це одне й те саме?"
        ];

        let answers = [true, true, true,false];

        let result = 0;

        for (let i = 0; i < questions.length; i++) {

            let answer = prompt(questions[i] + "\nВведіть Так або Ні:");

            let userAnswer;

            if (answer == "Так") {
                userAnswer = true;
            } else {
                userAnswer = false;
            }

            if (userAnswer == answers[i]) {
                result = result + 1;
            }
        }
        alert("Ваш результат: " + result + " з " + questions.length);
    </script>
</body>

</html>
