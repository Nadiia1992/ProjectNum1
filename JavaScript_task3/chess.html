<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Шахова дошка</title>

    <style>
        .red {
            background-color: red;
        }

        .yellow {
            background-color: yellow;
        }

        .cell {
            width: 50px;
            height: 50px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>Шахова дошка</h1>

    <div id="board"></div>

    <script>
        let board = [
            ["red", "yellow", "red", "yellow", "red", "yellow", "red", "yellow"],
            ["yellow", "red", "yellow", "red", "yellow", "red", "yellow", "red"],
            ["red", "yellow", "red", "yellow", "red", "yellow", "red", "yellow"],
            ["yellow", "red", "yellow", "red", "yellow", "red", "yellow", "red"],
            ["red", "yellow", "red", "yellow", "red", "yellow", "red", "yellow"],
            ["yellow", "red", "yellow", "red", "yellow", "red", "yellow", "red"],
            ["red", "yellow", "red", "yellow", "red", "yellow", "red", "yellow"],
            ["yellow", "red", "yellow", "red", "yellow", "red", "yellow", "red"]
        ];

        let table = document.getElementById("board");

        for (let i = 0; i < 8; i++) {

            for (let j = 0; j < 8; j++) {

                let cell = document.createElement("div");

                cell.className = "cell " + board[i][j];

                table.appendChild(cell);
            }

            table.appendChild(document.createElement("br"));
        }
    </script>

</body>

</html>
